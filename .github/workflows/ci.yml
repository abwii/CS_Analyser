name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-web:
    name: Lint web (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run lint --workspace web

  test-web:
    name: Test web (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run test --workspace web

  lint-api:
    name: Lint api (golangci-lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum

      - run: go mod download

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: apps/api

  test-api:
    name: Test api (go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum

      - run: go mod download

      - run: go test ./... -race

  lint-parser:
    name: Lint parser (clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parser
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: arduino/setup-protoc@v3
        with:
          version: "23.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/parser

      - run: cargo clippy --all-targets --all-features -- -D warnings

  test-parser:
    name: Test parser (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parser
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: arduino/setup-protoc@v3
        with:
          version: "23.4"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/parser

      - run: cargo test
