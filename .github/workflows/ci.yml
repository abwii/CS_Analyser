name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-web:
    name: Lint web (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run lint --workspace web

  test-web:
    name: Test web (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run test --workspace web

  lint-api:
    name: Lint api (golangci-lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/api/go.sum

      - run: go mod download

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: apps/api

  lint-parser:
    name: Lint parser (clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parser
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/parser

      - run: cargo clippy --all-targets --all-features -- -D warnings
