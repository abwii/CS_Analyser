[package]
name = "parser"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-sqs = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ahash = "0.8"
dotenvy = "0.15"
zstd = "0.14.4"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6.1"
tempfile = "3.27.0"

[dependencies.demoparser2]
package = "parser"
git = "https://github.com/LaihoE/demoparser"
rev = "dd71c09b32fb7ada7597bd83390a2ec3d3cd3812"
