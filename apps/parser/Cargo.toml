[package]
name = "parser"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-sqs = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ahash = "0.8"
dotenvy = "0.15"

[dependencies.demoparser2]
package = "parser"
git = "https://github.com/LaihoE/demoparser"
rev = "ba39cc44cd5abfd7f34df2b3c0a7dd3630048311"
